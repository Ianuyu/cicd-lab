name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # add your steps here, e.g. lint, test, build etc.
      - name: TypeScript typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            {
              echo "## TypeScript Typecheck Failed"
              echo ""
              echo "- Failed command: \`npm run typecheck\`"
              echo "- Cause: TypeScript found a type error in the source code."
              echo "- Fix: Correct the type mismatch, commit the changes, and push again."
              echo ""
              echo "### Error output"
              echo '```text'
              cat typecheck.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$status"

      - name: Prettier check
        id: prettier
        shell: bash
        run: |
          set +e
          npm run format:check 2>&1 | tee prettier.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            {
              echo "## Prettier Check Failed"
              echo ""
              echo "- Failed command: \`npm run format:check\`"
              echo "- Cause: Some files do not match Prettier formatting rules."
              echo "- Fix: Run \`npm run format\`, commit the changes, and push again."
              echo ""
              echo "### Error output"
              echo '```text'
              cat prettier.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$status"

      - name: Test
        run: npm test

      - name: Compute image tag
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          if [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION="${BRANCH_NAME#release/}"
            IMAGE_TAG="release-${VERSION}"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Print image metadata
        run: |
          echo "Node version: ${{ matrix.node-version }}"
          echo "Branch: ${{ steps.meta.outputs.branch_name }}"
          echo "Image tag: ${{ steps.meta.outputs.image_tag }}"

      - name: Build Docker image
        if: ${{ matrix.node-version == '24' }}
        run: docker build -t my-app:${{ steps.meta.outputs.image_tag }} .

  cd:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    needs: ci
    uses: ./.github/workflows/cd.yaml
